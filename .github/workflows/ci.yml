name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download JUnit console launcher
        run: |
          curl -fsSL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile
        run: |
          mkdir -p build/classes build/test-classes
          javac --release 17 -d build/classes $(find src/main/java -name '*.java')
          javac --release 17 -cp "build/classes:junit.jar" -d build/test-classes $(find src/test/java -name '*.java')

      - name: Test
        run: |
          java -jar junit.jar execute -cp "build/classes:build/test-classes" --details=tree
